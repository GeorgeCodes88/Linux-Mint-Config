# FONT
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.5

# CURSOR
cursor_shape beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# WINDOW
remember_window_size yes
initial_window_width 1200
initial_window_height 720
window_padding_width 12

# TRANSPARENCY
background_opacity 0.92

# TAB BAR
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style angled

# SCROLLBACK
scrollback_lines 10000

# COLORS
background #0d0d0d
foreground #cdd6f4
selection_background #2a2a3d
selection_foreground #cdd6f4

cursor #e63946
cursor_text_color #0d0d0d

url_color #e63946

active_tab_background #e63946
active_tab_foreground #0d0d0d

inactive_tab_background #1e1e2e
inactive_tab_foreground #a6adc8

# BLACK
color0 #1e1e2e
color8 #45475a

# RED
color1 #e63946
color9 #ff5c6c

# GREEN
color2 #a6e3a1
color10 #b7f0b1

# YELLOW
color3 #f9e2af
color11 #ffe7ba

# BLUE
color4 #89b4fa
color12 #9ec6ff

# MAGENTA
color5 #cba6f7
color13 #ddb6ff

# CYAN
color6 #94e2d5
color14 #a8f0e5

# WHITE
color7 #bac2de
color15 #ffffff

# remote control
allow_remote_control yes

# shell integration 
shell_integration no-sudo

# PERFORMANCE
repaint_delay 10
input_delay 3
sync_to_monitor yes

# MOUSE
copy_on_select yes
strip_trailing_spaces smart

# URLS
underline_hyperlinks always

# LIGATURES
disable_ligatures never

# WINDOW DECORATION
hide_window_decorations no

# BELL
enable_audio_bell no
visual_bell_duration 0.0

# CONFIRM CLOSE
confirm_os_window_close 0

# BETTER RESIZE
resize_in_steps yes